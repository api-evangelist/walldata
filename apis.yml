name: WallData
description: 'WallData (Wall Data Inc.) was a Kirkland, Washington host-connectivity software company,
  best known for its RUMBA family of PC-to-mainframe and AS/400 terminal-emulation and SNA-to-TCP/IP
  connectivity products. A Trinity Ventures portfolio company that reached an IPO exit, Wall Data was
  acquired by NetManage in 1999; the RUMBA product line later passed to Micro Focus and now sits under
  OpenText. The company is defunct and publishes no current developer portal, documentation, or public
  API surface. This profile is retained in the API Evangelist network as a historical VC-portfolio record.'
